<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Create Account</h1>
      <p>Sign up for a new DataDeck account</p>
    </div>

    <form class="auth-form" [formGroup]="signupForm" (ngSubmit)="onSignup()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          placeholder="Choose a username (min 3 characters)"
          [class.input-error]="signupForm.get('username')?.invalid && signupForm.get('username')?.touched"
        />
        <div class="validation-error" *ngIf="signupForm.get('username')?.invalid && signupForm.get('username')?.touched">
          <span *ngIf="signupForm.get('username')?.errors?.['required']">Username is required</span>
          <span *ngIf="signupForm.get('username')?.errors?.['minlength']">Username must be at least 3 characters</span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter your email"
          [class.input-error]="signupForm.get('email')?.invalid && signupForm.get('email')?.touched"
        />
        <div class="validation-error" *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
          <span *ngIf="signupForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="signupForm.get('email')?.errors?.['email']">Please enter a valid email address</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Create a password (min 6 characters)"
          [class.input-error]="signupForm.get('password')?.invalid && signupForm.get('password')?.touched"
        />
        <div class="validation-error" *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
          <span *ngIf="signupForm.get('password')?.errors?.['required']">Password is required</span>
          <span *ngIf="signupForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Creating account...' : 'Sign Up' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a (click)="goToLogin()">Log in</a></p>
    </div>
  </div>
</div>
